; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Default environment (only this environment will be built by default)
[platformio]
default_envs = esp32-s3-devkitc-1

; Common build flags for ESP32-S3-CAM
[env:esp32-s3-common]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries
monitor_speed = 115200

; PSRAM and debug configuration
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DMQTT_MAX_PACKET_SIZE=2048
    -DMQTT_KEEPALIVE=120
    -DSSL_MAX_CONTENT_LEN=16384
    -DWIFICLIENTSECURE_MAX_WRITE_RETRY_COUNT=10
    -DWIFICLIENTSECURE_MAX_WRITE_RETRY_WAIT_MS=100

; Flash and PSRAM interface mode (QIO Flash + OPI PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio

; Flash capacity and partition table (16MB)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Common dependencies
lib_deps =
    espressif/esp32-camera @ ^2.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    knolleary/PubSubClient @ 2.7.0
    bblanchon/ArduinoJson @ ^7.0.4
    fastled/FastLED @ ^3.6.0
    madhephaestus/ESP32Servo @ ^1.1.0

; Main application environment
[env:esp32-s3-devkitc-1]
extends = env:esp32-s3-common
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; LED Test environment (standalone hardware test)
[env:test_led]
extends = env:esp32-s3-common
build_src_filter = +<led.cpp> +<../test/layer1_hardware/test_led/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; OLED Test environment (standalone hardware test)
[env:test_oled]
extends = env:esp32-s3-common
build_src_filter = +<display.cpp> +<../test/layer1_hardware/test_oled/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; Servo Test environment (standalone hardware test)
[env:test_servo]
extends = env:esp32-s3-common
build_src_filter = +<servo.cpp> +<led.cpp> +<display.cpp> +<../test/layer1_hardware/test_servo/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; Servo Simple Test environment (minimal test for debugging)
[env:test_servo_simple]
extends = env:esp32-s3-common
build_src_filter = +<../test/layer1_hardware/test_servo_simple/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; Camera Test environment (layer2 test)
[env:test_camera]
extends = env:esp32-s3-common
build_src_filter = +<camera.cpp> +<../test/layer2_camera/test_camera/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; WiFi Test environment (layer3 test)
[env:test_wifi]
extends = env:esp32-s3-common
build_src_filter = +<network.cpp> +<../test/layer3_network/test_wifi/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; IoTDA Test environment (layer3 test)
[env:test_iotda]
extends = env:esp32-s3-common
build_src_filter = +<network.cpp> +<iotda.cpp> +<display.cpp> +<led.cpp> +<../test/layer3_network/test_iotda/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; OBS Test environment (layer4 test)
[env:test_obs]
extends = env:esp32-s3-common
build_src_filter = +<network.cpp> +<obs.cpp> +<display.cpp> +<led.cpp> +<../test/layer4_cloud/test_obs/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; AI Test environment (layer4 test)
[env:test_ai]
extends = env:esp32-s3-common
build_src_filter = +<network.cpp> +<camera.cpp> +<obs.cpp> +<ai.cpp> +<display.cpp> +<led.cpp> +<../test/layer4_cloud/test_ai/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries

; Minimal IoTDA Test environment (for debugging MQTT connection issues)
[env:test_iotda_minimal]
extends = env:esp32-s3-common
build_src_filter = +<../test/test_iotda_minimal/main.cpp>
lib_extra_dirs = D:/Users/StarrySky/.platformio/libraries
